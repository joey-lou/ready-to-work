[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ready-to-work"
version = "0.1.0"
description = "Architect loop framework for AI-driven development"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Joey Lou", email = "joey99lou@gmail.com"}
]
keywords = ["ai", "agent", "development", "automation", "llm", "cursor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
rtw = "rtw.cli:main"

[project.urls]
Homepage = "https://github.com/joey-lou/ready-to-work"
Documentation = "https://github.com/joey-lou/ready-to-work#readme"
Repository = "https://github.com/joey-lou/ready-to-work"
Issues = "https://github.com/joey-lou/ready-to-work/issues"

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rtw"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["rtw"]

[tool.coverage.run]
source = ["rtw"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
